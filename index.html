<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leandro Guimarães - FrioPeças</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background: linear-gradient(180deg, #dbeafe 0%, #e0f2fe 50%, #ffffff 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .card {
            background: #ffffff;
            border-radius: 24px;
            box-shadow: 0 15px 35px rgba(2, 132, 199, 0.15);
            max-width: 380px;
            width: 100%;
            padding: 35px 25px;
            text-align: center;
            border: 1px solid #bae6fd;
        }
        .logo-container {
            margin-bottom: 15px;
        }
        .logo {
            font-size: 28px;
            font-weight: 800;
            color: #0284c7;
            letter-spacing: -0.5px;
        }
        .subtitle {
            font-size: 11px;
            font-weight: 600;
            color: #0369a1;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-top: 2px;
        }
        .profile-img {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #0284c7;
            margin: 15px auto 12px auto;
            display: block;
            box-shadow: 0 6px 15px rgba(2, 132, 199, 0.25);
        }
        .profile-name {
            font-size: 22px;
            color: #0f172a;
            font-weight: 700;
            margin-bottom: 4px;
        }
        .profile-role {
            font-size: 14px;
            color: #64748b;
            margin-bottom: 25px;
        }
        .btn-whatsapp {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background-color: #25d366;
            color: #ffffff;
            font-size: 16px;
            font-weight: 700;
            text-decoration: none;
            padding: 16px 20px;
            border-radius: 14px;
            margin-bottom: 25px;
            box-shadow: 0 6px 16px rgba(37, 211, 102, 0.35);
            transition: all 0.2s ease;
        }
        .btn-whatsapp:hover {
            background-color: #20ba5a;
            transform: translateY(-2px);
        }
        .contact-list {
            list-style: none;
            text-align: left;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .contact-item {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 14px;
            padding: 10px 12px;
            border-radius: 10px;
            background-color: #f8fafc;
            border: 1px solid #e2e8f0;
        }
        .contact-item a {
            color: #0284c7;
            text-decoration: none;
            font-weight: 600;
            word-break: break-all;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="logo-container">
            <div class="logo">FrioPeças</div>
            <div class="subtitle">Ar-Condicionado & Soluções</div>
        </div>

        <!-- Foto do Vendedor enviada -->
           <img src="foto-leandro.jpeg" alt="Leandro Guimarães" class="profile-img">

        <h1 class="profile-name">Leandro Guimarães</h1>
        <p class="profile-role">Vendedor Especialista</p>

        <!-- Botão WhatsApp Clicável -->
        <a href="https://wa.me/5521995813821?text=Ol%C3%A1%20Leandro,%20vim%20pelo%20seu%20cart%C3%A3o%20digital!" class="btn-whatsapp" target="_blank">
            <span>💬</span> Clique aqui e Fale no WhatsApp
        </a>

        <!-- Lista de Contatos -->
        <ul class="contact-list">
            <li class="contact-item">
                <span>📱</span>
                <div>
                    <span style="color: #64748b; font-size: 12px; display: block;">Telefone / Celular</span>
                    <a href="tel:5521995813821">(21) 99581-3821</a>
                </div>
            </li>
            <li class="contact-item">
                <span>📷</span>
                <div>
                    <span style="color: #64748b; font-size: 12px; display: block;">Instagram</span>
                    <a href="https://instagram.com/leandroayra.ar" target="_blank">@leandroayra.ar</a>
                </div>
            </li>
            <li class="contact-item">
                <span>✉️</span>
                <div>
                    <span style="color: #64748b; font-size: 12px; display: block;">E-mail</span>
                    <a href="mailto:leandro.guimaraes@friopecas.com.br">leandro.guimaraes@friopecas.com.br</a>
                </div>
            </li>
        </ul>
    </div>

</body>
</html>
